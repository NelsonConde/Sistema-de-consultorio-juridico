spring.application.name=legal_cases

# Puerto de la aplicacion 
server.port=${PORT:8080}


# BASE DE DATOS

# Supabase PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# LOGGING
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_HIBERNATE_BIND:WARN}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-sin-correlation}] %logger{36} - %msg%n

# ACTUATOR / METRICS
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95

# Schema por defecto
spring.jpa.properties.hibernate.default_schema="DB_consultorioJuridico"
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true


# SEGURIDAD

# Configuracion JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Configuracion de cookie JWT
# En despliegues frontend/backend cross-site se requiere SameSite=None y Secure=true.
# Para desarrollo local por HTTP se puede usar AUTH_COOKIE_SECURE=false y AUTH_COOKIE_SAME_SITE=Lax.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:None}

# Proteccion CSRF
app.security.csrf.secure=${CSRF_COOKIE_SECURE:true}
app.security.csrf.same-site=${CSRF_COOKIE_SAME_SITE:None}

# Configuracion CORS
# Lista de origenes exactos permitidos, separados por coma si existe mas de uno.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# CORREOS Y RECUPERACION DE CONTRASEÑA

# Envio de correos por Brevo API HTTP
brevo.api-key=${BREVO_API_KEY}
app.mail.from-email=${MAIL_FROM_EMAIL}

# Datos del backend para correos
app.mail.from-name=Consultorio Juridico
app.mail.app-name=Consultorio Juridico

# app real en prod
app.frontend.reset-password-url=${FRONTEND_URL:http://localhost:3000}/restablecer-password
app.password-reset.expiration-minutes=15



# ARCHIVOS

# Supabase Storage (credenciales inyectadas por Railway)
supabase.storage.endpoint=${SUPABASE_STORAGE_ENDPOINT}
supabase.storage.region=${SUPABASE_STORAGE_REGION}
supabase.storage.access-key=${SUPABASE_STORAGE_ACCESS_KEY}
supabase.storage.secret-key=${SUPABASE_STORAGE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:legal-documents}

# Límite coherente con el bucket legal-documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.storage.upload-url-validity=${FILE_UPLOAD_URL_VALIDITY:PT10M}
file.storage.download-url-validity=${FILE_DOWNLOAD_URL_VALIDITY:PT5M}


# TAREAS PROGRAMADAS

# Scheduler para procesar recordatorios pendientes de seguimientos
# Por defecto se ejecuta todos los dias a las 8:00 AM
app.seguimiento.notificaciones.cron=0 0 8 * * *
app.time-zone=${APP_TIME_ZONE:America/Bogota}
