name: PR Title Convention

# On pull_request, use the base SHA for scripts (not PR code).
# Workflow definitions can be changed by a PR; keep permissions read-only
# and require independent review of workflow edits before integration.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [develop, staging, main]

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted target branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run trusted validation tests
        run: node --test .github/scripts/validate-pr-title.test.mjs

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: node .github/scripts/validate-pr-title.mjs
