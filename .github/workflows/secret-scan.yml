name: Secret scan for pull requests

on:
  pull_request:
    branches: [develop, staging, main]

permissions:
  contents: read

jobs:
  changed-file-scan:
    name: Scan changed files without exposing findings
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned detector
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0

      - name: Scan prospective changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/scan_changed_secrets.py
