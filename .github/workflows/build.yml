name: Build

on:
  push:
    branches:
      - develop
      - staging
      - main
      - feature/**
      - bugfix/**
      - hotfix/**
      - chore/**
      - docs/**
  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/app/pom.xml

      - name: Restore Maven Wrapper distribution cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('backend/app/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Ensure Maven Wrapper is available
        working-directory: backend/app
        shell: bash
        run: |
          chmod +x mvnw
          for attempt in 1 2 3; do
            # The alternate official Maven Central hostname is used only after the first failure.
            if [ "$attempt" -eq 1 ]; then
              if ./mvnw --version; then exit 0; fi
            elif MVNW_REPOURL=https://repo1.maven.org/maven2 ./mvnw --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Wrapper distribution download failed from both Maven Central hostnames"
              exit 1
            fi
            sleep 5
          done

      - name: Verify backend and generate coverage
        working-directory: backend/app
        run: ./mvnw clean verify

      - name: Validate JaCoCo artifacts
        working-directory: backend/app
        run: |
          test -s target/jacoco.exec
          test -s target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/app/target/site/jacoco/
            backend/app/target/jacoco.exec
          if-no-files-found: error
          retention-days: 7

      - name: Verify packaged migration command in isolated PostgreSQL
        working-directory: backend/app
        run: python3 db/tests/run_packaged_migration_smoke.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: >-
          npm run test --
          --project=chromium
          --workers=1
          --retries=0
          --reporter=line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image with release Dockerfile
        run: docker build --pull --no-cache --file backend/app/Dockerfile --tag legal-cases-backend:ci backend/app

      - name: Check packaged runtime and migrations artifacts
        run: |
          docker run --rm --entrypoint sh legal-cases-backend:ci -ec '
            test -s /app/app.jar
            test -s /app/migrations.jar
            java -version
          '
