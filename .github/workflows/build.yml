name: Build

on:
  push:
    branches:
      - develop
      - staging
      - main
      - feature/**
      - bugfix/**
      - hotfix/**
      - chore/**
  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/app/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: backend/app
        run: chmod +x mvnw


      - name: Verify backend and generate coverage
        working-directory: backend/app
        run: ./mvnw clean verify

      - name: Validate JaCoCo artifacts
        working-directory: backend/app
        run: |
          test -s target/jacoco.exec
          test -s target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/app/target/site/jacoco/
            backend/app/target/jacoco.exec
          if-no-files-found: error
          retention-days: 7

      - name: Verify packaged migration command in isolated PostgreSQL
        working-directory: backend/app
        run: python3 db/tests/run_packaged_migration_smoke.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: >-
          npm run test --
          --project=chromium
          --workers=1
          --retries=0
          --reporter=line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
